<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <style>
      .header-title { font: 900 60px 'Noto Sans CJK SC','Noto Sans',Arial,sans-serif; fill:#fff; }
      .header-subtitle { font: 900 34px 'Noto Sans','Noto Sans CJK SC',Arial,sans-serif; fill:#fff; }
      .brand { font: 900 34px 'Noto Sans CJK SC','Noto Sans',Arial,sans-serif; fill:#fff; }
      .rank { font: 900 74px 'Noto Sans',Arial,sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .anime { font: 800 36px 'Noto Sans CJK SC','Noto Sans',Arial,sans-serif; fill:#fff; }
      .label { font: 800 16px 'Noto Sans','Noto Sans CJK SC',Arial,sans-serif; }
      .metric { font: 900 46px 'Noto Sans','Noto Sans CJK SC',Arial,sans-serif; fill:#fff; }
      .small { font: 800 14px 'Noto Sans CJK SC','Noto Sans',Arial,sans-serif; }
      .footer { font: 400 25px 'Noto Sans CJK SC','Noto Sans',Arial,sans-serif; }
    </style>
    <linearGradient id="veil-x" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="veil-y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
  </defs>

  <!-- No full-canvas rectangle: the exported SVG/PNG background is transparent. -->
  <rect width="1200" height="146" fill="#000"/>
  <rect width="344" height="146" fill="#ff686f"/>
  <text x="26" y="82" class="brand">现视妍 ACG部</text>
  <text x="365" y="70" class="header-title">7月新番中期评分 TOP 10</text>
  <text x="365" y="118" class="header-subtitle">2026 MID-SEASON RESULTS</text>

  <!-- Right-side labels appear once, above row 1. -->
  <g transform="translate(831 156)">
    <rect width="185" height="28" fill="#dd0000"/>
    <rect x="185" width="160" height="28" fill="#fff"/>
    <text x="12" y="20" class="label" fill="#fff">AVERAGE SCORE</text>
    <text x="199" y="20" class="label" fill="#000">RATERS</text>
  </g>

  <!-- Geometry-only row scaffold. Clone this group to the measured row starts. -->
  <g id="row-template" transform="translate(22 168)">
    <rect x="3" y="136" width="1157" height="4" fill="#304648" fill-opacity=".58"/>

    <rect width="110" height="136" fill="#ff686f"/>
    <text x="55" y="68" class="rank" fill="#fff">1</text>

    <rect x="110" width="699" height="136" fill="#555"/>
    <rect x="110" width="699" height="136" fill="url(#veil-x)"/>
    <rect x="110" width="699" height="136" fill="url(#veil-y)"/>
    <text x="130" y="111" class="anime">动画标题</text>

    <rect x="809" width="345" height="136" fill="#1e1e1e"/>
    <text x="901.5" y="82" text-anchor="middle" class="metric">8.57</text>
    <text x="1074" y="82" text-anchor="middle" class="metric">7</text>

    <rect x="809" y="116" width="185" height="20" fill="#ffb018"/>
    <rect x="994" y="116" width="160" height="20" fill="#36c120"/>
    <text x="901.5" y="131" text-anchor="middle" class="small" fill="#000">平均评分</text>
    <text x="1074" y="131" text-anchor="middle" class="small" fill="#000">7 人评分</text>
  </g>

  <!-- Footer text only; footer background remains transparent. -->
  <text x="600" y="1717" text-anchor="middle" class="footer">基于本次有效问卷统计 · 补丁已纳入</text>
  <text x="600" y="1755" text-anchor="middle" class="footer" fill="#237ea5">平均分仅统计有效评分 · 右栏为评分人数</text>
</svg>

name: Verify six poster modes

on:
  push:
    branches:
      - feature/six-poster-modes
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow renderer dependencies
        run: python -m pip install -r tools/ranking-poster/requirements.txt
      - name: Run Node tests
        run: npm test
      - name: Run Pillow tests
        working-directory: tools/ranking-poster
        run: python -m unittest test_render.py
      - name: Check JavaScript syntax
        run: |
          node --check src/poster-model.js
          node --check src/poster-renderer.js
          node --check src/poster-editor.js
          node --check scripts/poster-asset-store.mjs
          node --check scripts/serve.mjs

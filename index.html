<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="编辑动画问卷题目并生成平台导入文本。" />
    <title>番组投票题目编辑器</title>
    <link rel="stylesheet" href="bangumi-components.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__row">
        <a class="app-name" href="/">番组投票题目编辑器</a>
        <output class="save-status" id="save-status" aria-live="polite">正在载入</output>
      </div>
      <nav class="bgm-tab app-tabs" aria-label="工作区">
        <a class="bgm-tab__item bgm-tab__item--active" href="/">题目</a>
        <a class="bgm-tab__item" href="/images.html">图片</a>
      </nav>
    </header>

    <main class="editor-shell">
      <div class="load-error" id="load-error" role="alert" hidden></div>

      <div class="editor-layout" id="editor-workspace" hidden>
        <div class="editor-column">
          <section class="panel" aria-labelledby="project-heading">
            <div class="section-heading">
              <h1 id="project-heading">项目</h1>
            </div>

            <div class="field-grid field-grid--two">
              <label class="field" for="project-title">
                <span class="field__label">问卷标题</span>
                <span class="bgm-input__wrapper bgm-input__wrapper--rounded">
                  <input class="bgm-input" id="project-title" type="text" />
                </span>
                <small class="field-message" id="project-title-message"></small>
              </label>

              <label class="field" for="platform">
                <span class="field__label">目标平台</span>
                <span class="bgm-select">
                  <span class="bgm-select__box">
                    <span id="platform-label">问卷星</span>
                    <span class="bgm-select__arrow" aria-hidden="true">⌄</span>
                  </span>
                  <select id="platform">
                    <option value="wjx">问卷星</option>
                    <option value="tencent">腾讯问卷</option>
                  </select>
                </span>
                <small class="field-message" id="platform-message"></small>
              </label>
            </div>

            <label class="field" for="project-description">
              <span class="field__label">问卷说明</span>
              <span class="bgm-editor__container field-editor field-editor--short">
                <textarea class="bgm-editor__text" id="project-description" rows="3"></textarea>
              </span>
              <small class="field-message" id="project-description-message"></small>
            </label>
          </section>

          <section class="panel" aria-labelledby="template-heading">
            <div class="section-heading">
              <h2 id="template-heading">题目模板</h2>
            </div>

            <div class="field-grid field-grid--two">
              <label class="field" for="expansion-mode">
                <span class="field__label">展开方式</span>
                <span class="bgm-select">
                  <span class="bgm-select__box">
                    <span id="expansion-label">每部动画一道题</span>
                    <span class="bgm-select__arrow" aria-hidden="true">⌄</span>
                  </span>
                  <select id="expansion-mode">
                    <option value="perAnime">每部动画一道题</option>
                    <option value="allAsOptions">全部动画作为选项</option>
                  </select>
                </span>
                <small class="field-message" id="expansion-message"></small>
              </label>

              <label class="field" for="question-type">
                <span class="field__label">题型</span>
                <span class="bgm-select">
                  <span class="bgm-select__box">
                    <span id="question-type-label">量表题</span>
                    <span class="bgm-select__arrow" aria-hidden="true">⌄</span>
                  </span>
                  <select id="question-type">
                    <option value="single">单选题</option>
                    <option value="multiple">多选题</option>
                    <option value="dropdown">下拉题</option>
                    <option value="scale">量表题</option>
                    <option value="shortText">单行文本题</option>
                    <option value="longText">多行文本题</option>
                  </select>
                </span>
                <small class="field-message" id="question-type-message"></small>
              </label>
            </div>

            <label class="field" for="question-prompt">
              <span class="field__label">题干</span>
              <span class="bgm-input__wrapper bgm-input__wrapper--rounded">
                <input class="bgm-input" id="question-prompt" type="text" />
              </span>
              <small class="field__hint">可使用 {title} 和 {index}。</small>
              <small class="field-message" id="question-prompt-message"></small>
            </label>

            <label class="field" id="question-options-field" for="question-options">
              <span class="field__label">选项</span>
              <span class="bgm-editor__container field-editor">
                <textarea
                  class="bgm-editor__text"
                  id="question-options"
                  rows="5"
                  placeholder="每行一个选项"
                ></textarea>
              </span>
              <small class="field-message" id="question-options-message"></small>
            </label>

            <fieldset class="scale-fields" id="scale-fields">
              <legend>量表设置</legend>
              <div class="field-grid field-grid--two">
                <label class="field" for="scale-min">
                  <span class="field__label">最小值</span>
                  <span class="bgm-input__wrapper bgm-input__wrapper--rounded">
                    <input class="bgm-input" id="scale-min" type="number" step="1" />
                  </span>
                </label>
                <label class="field" for="scale-max">
                  <span class="field__label">最大值</span>
                  <span class="bgm-input__wrapper bgm-input__wrapper--rounded">
                    <input class="bgm-input" id="scale-max" type="number" step="1" />
                  </span>
                </label>
                <label class="field" for="scale-min-label">
                  <span class="field__label">最小值标签</span>
                  <span class="bgm-input__wrapper bgm-input__wrapper--rounded">
                    <input class="bgm-input" id="scale-min-label" type="text" />
                  </span>
                </label>
                <label class="field" for="scale-max-label">
                  <span class="field__label">最大值标签</span>
                  <span class="bgm-input__wrapper bgm-input__wrapper--rounded">
                    <input class="bgm-input" id="scale-max-label" type="text" />
                  </span>
                </label>
              </div>
              <small class="field-message" id="scale-message"></small>
            </fieldset>
          </section>

          <section class="panel" aria-labelledby="entries-heading">
            <div class="section-heading section-heading--actions">
              <div>
                <h2 id="entries-heading">动画条目</h2>
                <output class="entry-count" id="entry-count">0 部</output>
              </div>
              <button class="bgm-button bgm-button--secondary" id="clear-entries" type="button" disabled>
                清空
              </button>
            </div>

            <label class="field" for="bulk-titles">
              <span class="field__label">批量加入标题</span>
              <span class="bgm-editor__container field-editor">
                <textarea
                  class="bgm-editor__text"
                  id="bulk-titles"
                  rows="5"
                  placeholder="每行一部动画"
                ></textarea>
              </span>
            </label>
            <button class="bgm-button bgm-button--primary bgm-button--color-blue" id="add-titles" type="button">
              加入标题
            </button>
            <small class="field-message" id="entries-message" aria-live="polite"></small>
            <div class="entry-list" id="entry-list"></div>
          </section>
        </div>

        <aside class="output-column">
          <section class="panel output-panel" aria-labelledby="preview-heading">
            <div class="section-heading">
              <h2 id="preview-heading">题目实例</h2>
              <output class="question-count" id="question-count">0 道题</output>
            </div>
            <ol class="question-preview" id="question-preview"></ol>
          </section>

          <section class="panel output-panel" aria-labelledby="output-heading">
            <div class="section-heading">
              <div>
                <h2 id="output-heading">导入文本</h2>
                <p class="output-note">文本只包含题目，不包含图片。</p>
              </div>
            </div>
            <small class="field-message field-message--output" id="output-message" aria-live="polite"></small>
            <label class="field" for="generated-text">
              <span class="bgm-editor__container generated-editor">
                <textarea class="bgm-editor__text" id="generated-text" rows="18" readonly></textarea>
              </span>
            </label>
            <div class="export-actions">
              <button class="bgm-button bgm-button--primary" id="copy-text" type="button" disabled>
                复制文本
              </button>
              <button class="bgm-button bgm-button--secondary bgm-button--color-blue" id="download-text" type="button" disabled>
                下载 TXT
              </button>
            </div>
          </section>
        </aside>
      </div>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
